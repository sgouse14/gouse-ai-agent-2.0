<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gouse AI Architecture</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><div><h1>Gouse AI</h1><p>Architecture Intelligence Workspace</p></div><button id="refresh">Refresh</button></header><section class="grid"><aside><h2>Projects</h2><form id="project-form"><input id="project-name" placeholder="Project name" required><input id="project-type" placeholder="Project type" value="architecture"><input id="project-location" placeholder="Location"><textarea id="project-description" placeholder="Project description"></textarea><button>Create Project</button></form><div id="projects"></div></aside><section class="workspace"><h2 id="workspace-title">Select a project</h2><div id="project-info"></div><div class="actions"><label class="upload">Choose file<input id="file" type="file" hidden></label><button id="attach" disabled>Attach File</button><button id="intelligence" disabled>Run Intelligence</button></div><pre id="report">Create or select a project to begin.</pre></section></section><section class="chat-panel"><h2>Ask Gouse AI</h2><section id="chat"></section><form id="form"><input id="message" placeholder="Ask about architecture, materials, BOQ..." autocomplete="off"><button>Send</button></form></section></main><script src="/app.js"></script></body></html>
