<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gouse AI Architecture</title><link rel="stylesheet" href="/style.css"></head><body><main><section id="auth-panel" class="auth-panel"><h1>Gouse AI</h1><p>Sign in to your Architecture Intelligence Workspace.</p><form id="auth-form"><input id="auth-email" type="email" placeholder="Email" required><input id="auth-password" type="password" placeholder="Password (minimum 8 characters)" required minlength="8"><div class="actions"><button type="submit">Login</button><button type="button" id="register">Create Account</button></div></form><p id="auth-status"></p></section><section id="app-panel" hidden><header><div><h1>Gouse AI</h1><p>Architecture Intelligence Workspace</p></div><div class="actions"><span id="user-status"></span><button id="refresh">Refresh</button><button id="logout">Logout</button></div></header><section class="grid"><aside><h2>Projects</h2><form id="project-form"><input id="project-name" placeholder="Project name" required><input id="project-type" placeholder="Project type" value="architecture"><input id="project-location" placeholder="Location"><textarea id="project-description" placeholder="Project description"></textarea><button>Create Project</button></form><div id="projects"></div></aside><section class="workspace"><h2 id="workspace-title">Select a project</h2><div id="project-info"></div><div class="actions"><label class="upload">Choose file<input id="file" type="file" hidden></label><button id="attach" disabled>Attach File</button><button id="intelligence" disabled>Run Intelligence</button></div><pre id="report">Create or select a project to begin.</pre><section id="team-panel" hidden><h2>Team</h2><div id="team-role"></div><form id="member-form"><input id="member-email" type="email" placeholder="Collaborator email" required><select id="member-role"><option value="architect">Architect</option><option value="engineer">Engineer</option><option value="viewer">Viewer</option></select><button type="submit">Invite Member</button></form><div id="members"></div></section><section id="activity-panel" hidden><div class="actions"><h2>Activity Timeline</h2><button id="refresh-activity">Refresh Activity</button></div><div id="activity"></div></section></section></section><section class="chat-panel"><h2>Ask Gouse AI</h2><section id="chat"></section><form id="form"><input id="message" placeholder="Ask about architecture, materials, BOQ..." autocomplete="off"><button id="voice-command" type="button" title="Speak to Gouse AI">🎤 Voice</button><button>Send</button></form><p id="voice-status" aria-live="polite"></p></section></section></main><script src="/app.js"></script></body></html>
