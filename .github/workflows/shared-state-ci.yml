name: Shared state and reliability CI

on:
  pull_request:
    branches:
      - main
      - feature/saqlain-cyber-agent
  push:
    branches:
      - feat/shared-durable-state-reliability-clean
      - integration/consolidated-unfinished-work
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-state-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Tests, type checks, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run automated tests
        run: npm test

      - name: Check client TypeScript
        run: npm run typecheck

      - name: Check server TypeScript
        run: npm run typecheck:server

      - name: Build production assets and server
        run: npm run build

      - name: Build Docker image
        run: docker build -t gouse-ai-agent:ci .
