name: Saqlain Security Tests

on:
  push:
    branches: [main, feature/saqlain-cyber-agent]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saqlain-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-unit-tests:
    name: Security tests, type-check, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run security unit tests
        run: bun run test

      - name: Type-check
        run: bun run typecheck

      - name: Type-check server authorization code
        run: bun run typecheck:server

      - name: Build frontend and server
        run: bun run build

      - name: Build Docker image
        run: docker build --pull -t gouse-ai-agent:ci .
